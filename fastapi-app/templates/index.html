<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        :root {
            --burgundy: #8B0029;
            --burgundy-dark: #6B001F;
            --burgundy-light: #B8334F;
            --burgundy-soft: #F5E6EA;
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --border: #e5e5e5;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        header {
            border-bottom: 3px solid var(--burgundy);
            padding-bottom: 16px;
            margin-bottom: 32px;
        }
        h1 {
            color: var(--burgundy);
            margin: 0;
            font-size: 2em;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 4px;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .priority-legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.8em;
            color: var(--text-muted);
        }
        .priority-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .priority-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
        .priority-red       { background: #e53935; }
        .priority-orange    { background: #fb8c00; }
        .priority-yellowgreen { background: #cddc39; }
        .priority-green     { background: #43a047; }
        .priority-btn {
            width: 18px;
            height: 18px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.2);
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .priority-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }
        h2 {
            font-size: 1.15em;
            color: var(--text);
            margin: 28px 0 12px;
            padding-left: 10px;
            border-left: 4px solid var(--burgundy);
        }
        h2.completed-title {
            border-left-color: var(--text-muted);
            color: var(--text-muted);
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        li:hover { border-color: var(--burgundy-light); }
        li.completed {
            background: #fafafa;
            border-color: var(--border);
        }
        li.completed span.text { text-decoration: line-through; color: var(--text-muted); }
        .text { flex: 1; }
        .text strong { color: var(--burgundy); margin-right: 4px; }
        li.completed .text strong { color: var(--text-muted); }
        .due-date { font-size: 0.85em; color: var(--text-muted); margin-left: 6px; }
        .due-overdue { color: var(--burgundy); font-weight: 600; }

        form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 28px;
            padding: 20px;
            background: var(--burgundy-soft);
            border-radius: 10px;
        }
        input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font-size: 0.95em;
            flex: 1;
            min-width: 140px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus {
            border-color: var(--burgundy);
            box-shadow: 0 0 0 3px rgba(139, 0, 41, 0.12);
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: background 0.15s, transform 0.05s;
        }
        button:active { transform: translateY(1px); }
        .btn-check {
            background: var(--burgundy);
            color: #fff;
        }
        .btn-check:hover { background: var(--burgundy-dark); }
        .btn-edit {
            background: #fff;
            color: var(--burgundy);
            border: 1px solid var(--burgundy);
        }
        .btn-edit:hover { background: var(--burgundy-soft); }
        .btn-delete {
            background: #fff;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-delete:hover {
            background: var(--burgundy);
            color: #fff;
            border-color: var(--burgundy);
        }
        .btn-submit {
            background: var(--burgundy);
            color: #fff;
            padding: 10px 20px;
        }
        .btn-submit:hover { background: var(--burgundy-dark); }

        .empty {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.9em;
            border: 1px dashed var(--border);
            border-radius: 8px;
        }

        .timeline {
            margin-top: 40px;
            padding: 20px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
        }
        .timeline-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .timeline-row-label {
            width: 130px;
            flex-shrink: 0;
            font-size: 0.85em;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
        }
        .timeline-row-label.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .timeline-track {
            position: relative;
            flex: 1;
            height: 22px;
            background: #f5f5f5;
            border-radius: 4px;
            overflow: visible;
        }
        .timeline-axis-row .timeline-track {
            background: transparent;
            height: 18px;
        }
        .timeline-axis-label {
            position: absolute;
            top: 0;
            font-size: 0.72em;
            color: var(--text-muted);
            transform: translateX(-50%);
            white-space: nowrap;
        }
        .timeline-axis-label:first-child { transform: translateX(0); }
        .timeline-axis-label:last-child { transform: translateX(-100%); }
        .timeline-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(33, 150, 243, 0.35);
            border: 1px solid rgba(33, 150, 243, 0.7);
            border-radius: 4px;
            min-width: 4px;
        }
        .timeline-today {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 2px;
            background: var(--burgundy);
            z-index: 5;
            pointer-events: none;
        }
        .timeline-today-label {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            font-size: 0.72em;
            color: var(--burgundy);
            font-weight: 600;
            white-space: nowrap;
        }
        .timeline-legend {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            font-size: 0.8em;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-swatch {
            display: inline-block;
            width: 18px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <header>
        <h1>To-Do List</h1>
        <div class="header-row">
            <div class="subtitle">오늘의 할 일을 관리하세요</div>
            <div class="priority-legend">
                <span class="priority-legend-item" title="지금 바로 처리해야 하는 일">
                    <span class="priority-dot priority-red"></span>긴급·중요
                </span>
                <span class="priority-legend-item" title="중요하지만 여유 있게 진행해도 되는 일">
                    <span class="priority-dot priority-orange"></span>중요
                </span>
                <span class="priority-legend-item" title="급하지만 비중이 크지 않은 일">
                    <span class="priority-dot priority-yellowgreen"></span>긴급
                </span>
                <span class="priority-legend-item" title="시간 날 때 처리해도 되는 일">
                    <span class="priority-dot priority-green"></span>일반
                </span>
            </div>
        </div>
    </header>

    <h2>미완료 리스트</h2>
    <ul id="todo-incomplete"></ul>

    <h2 class="completed-title">완료 리스트</h2>
    <ul id="todo-complete"></ul>

    <form id="todo-form">
        <input type="text" id="title" placeholder="제목" required>
        <input type="text" id="description" placeholder="설명" required>
        <input type="date" id="due_date">
        <button type="submit" class="btn-submit">추가</button>
    </form>

    <section class="timeline">
        <h2>마감일 타임라인</h2>
        <div id="timeline-empty" class="empty" style="display:none;">
            표시할 항목이 없습니다 (생성일과 마감일이 모두 있는 To-Do만 표시됩니다)
        </div>
        <div id="timeline-content"></div>
        <div class="timeline-legend">
            <div class="legend-item">
                <span class="legend-swatch" style="background: rgba(33, 150, 243, 0.35); border: 1px solid rgba(33, 150, 243, 0.7);"></span>
                생성일 → 마감일
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background: var(--burgundy); width: 3px;"></span>
                오늘
            </div>
        </div>
    </section>
    <script>
        function sortByDueDate(todos) {
            return todos.slice().sort((a, b) => {
                if (!a.due_date && !b.due_date) return 0;
                if (!a.due_date) return 1;
                if (!b.due_date) return -1;
                return a.due_date.localeCompare(b.due_date);
            });
        }

        const PRIORITY_ORDER = ['green', 'yellowgreen', 'orange', 'red'];
        const PRIORITY_LABEL = {
            red: '긴급·중요',
            orange: '중요',
            yellowgreen: '긴급',
            green: '일반'
        };

        function renderTodoItem(todo) {
            const li = document.createElement('li');
            if (todo.completed) li.classList.add('completed');

            const today = new Date().toISOString().slice(0, 10);
            let dueText = '';
            let dueClass = 'due-date';
            if (todo.due_date) {
                dueText = ` | 마감일: ${todo.due_date}`;
                if (!todo.completed && todo.due_date < today) dueClass += ' due-overdue';
            }

            if (!todo.completed) {
                const priority = todo.priority || 'green';
                const priorityButton = document.createElement('button');
                priorityButton.className = `priority-btn priority-${priority}`;
                priorityButton.title = `우선순위: ${PRIORITY_LABEL[priority]} (클릭하여 변경)`;
                priorityButton.onclick = () => cyclePriority(todo);
                li.appendChild(priorityButton);
            }

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.innerHTML = `<strong>${todo.title}</strong>: ${todo.description}<span class="${dueClass}">${dueText}</span>`;

            const checkButton = document.createElement('button');
            checkButton.className = 'btn-check';
            checkButton.textContent = todo.completed ? '취소' : '완료';
            checkButton.onclick = () => toggleComplete(todo);

            const editButton = document.createElement('button');
            editButton.className = 'btn-edit';
            editButton.textContent = '수정';
            editButton.onclick = () => editTodo(todo);

            const deleteButton = document.createElement('button');
            deleteButton.className = 'btn-delete';
            deleteButton.textContent = '삭제';
            deleteButton.onclick = () => deleteTodo(todo.id);

            li.appendChild(textSpan);
            li.appendChild(checkButton);
            li.appendChild(editButton);
            li.appendChild(deleteButton);
            return li;
        }

        async function cyclePriority(todo) {
            const current = todo.priority || 'green';
            const idx = PRIORITY_ORDER.indexOf(current);
            const next = PRIORITY_ORDER[(idx + 1) % PRIORITY_ORDER.length];
            const response = await fetch(`/todos/${todo.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: todo.id,
                    title: todo.title,
                    description: todo.description,
                    completed: todo.completed,
                    due_date: todo.due_date,
                    created_at: todo.created_at,
                    priority: next
                })
            });
            if (response.ok) fetchTodos();
        }

        function renderEmpty(message) {
            const li = document.createElement('li');
            li.className = 'empty';
            li.style.display = 'block';
            li.style.border = '1px dashed var(--border)';
            li.style.boxShadow = 'none';
            li.textContent = message;
            return li;
        }

        async function fetchTodos() {
            const response = await fetch('/todos');
            const todos = await response.json();

            const incomplete = sortByDueDate(todos.filter(t => !t.completed));
            const complete = sortByDueDate(todos.filter(t => t.completed));

            const incompleteList = document.getElementById('todo-incomplete');
            const completeList = document.getElementById('todo-complete');
            incompleteList.innerHTML = '';
            completeList.innerHTML = '';

            if (incomplete.length === 0) {
                incompleteList.appendChild(renderEmpty('미완료 항목이 없습니다.'));
            } else {
                incomplete.forEach(todo => incompleteList.appendChild(renderTodoItem(todo)));
            }

            if (complete.length === 0) {
                completeList.appendChild(renderEmpty('완료된 항목이 없습니다.'));
            } else {
                complete.forEach(todo => completeList.appendChild(renderTodoItem(todo)));
            }

            renderTimeline(todos);
        }

        function renderTimeline(todos) {
            const valid = todos.filter(t => t.created_at && t.due_date);
            const emptyEl = document.getElementById('timeline-empty');
            const contentEl = document.getElementById('timeline-content');

            if (valid.length === 0) {
                emptyEl.style.display = 'block';
                contentEl.innerHTML = '';
                return;
            }
            emptyEl.style.display = 'none';

            const today = new Date().toISOString().slice(0, 10);
            const allDates = [today];
            valid.forEach(t => { allDates.push(t.created_at, t.due_date); });

            let minDate = allDates.reduce((a, b) => a < b ? a : b);
            let maxDate = allDates.reduce((a, b) => a > b ? a : b);

            const minD = new Date(minDate);
            minD.setDate(minD.getDate() - 3);
            const maxD = new Date(maxDate);
            maxD.setDate(maxD.getDate() + 3);

            const totalMs = maxD - minD;
            const pct = (dateStr) => ((new Date(dateStr) - minD) / totalMs) * 100;

            contentEl.innerHTML = '';

            // 축 (날짜 라벨 + 오늘 마커)
            const axisRow = document.createElement('div');
            axisRow.className = 'timeline-row timeline-axis-row';
            const axisLabel = document.createElement('div');
            axisLabel.className = 'timeline-row-label';
            axisLabel.textContent = '';
            const axisTrack = document.createElement('div');
            axisTrack.className = 'timeline-track';

            const fmt = d => d.toISOString().slice(0, 10);
            const startLbl = document.createElement('span');
            startLbl.className = 'timeline-axis-label';
            startLbl.style.left = '0%';
            startLbl.textContent = fmt(minD);
            axisTrack.appendChild(startLbl);

            const endLbl = document.createElement('span');
            endLbl.className = 'timeline-axis-label';
            endLbl.style.left = '100%';
            endLbl.textContent = fmt(maxD);
            axisTrack.appendChild(endLbl);

            const todayLbl = document.createElement('span');
            todayLbl.className = 'timeline-today-label';
            todayLbl.style.left = pct(today) + '%';
            todayLbl.textContent = '오늘 ' + today;
            axisTrack.appendChild(todayLbl);

            axisRow.appendChild(axisLabel);
            axisRow.appendChild(axisTrack);
            contentEl.appendChild(axisRow);

            // 각 todo 행
            valid.forEach(todo => {
                const row = document.createElement('div');
                row.className = 'timeline-row';

                const label = document.createElement('div');
                label.className = 'timeline-row-label' + (todo.completed ? ' completed' : '');
                label.textContent = todo.title;
                label.title = todo.title;

                const track = document.createElement('div');
                track.className = 'timeline-track';

                const bar = document.createElement('div');
                bar.className = 'timeline-bar';
                const left = pct(todo.created_at);
                const right = pct(todo.due_date);
                bar.style.left = left + '%';
                bar.style.width = Math.max(right - left, 0.3) + '%';
                bar.title = `${todo.title}\n생성일: ${todo.created_at}\n마감일: ${todo.due_date}`;
                track.appendChild(bar);

                const todayLine = document.createElement('div');
                todayLine.className = 'timeline-today';
                todayLine.style.left = pct(today) + '%';
                track.appendChild(todayLine);

                row.appendChild(label);
                row.appendChild(track);
                contentEl.appendChild(row);
            });
        }

        async function toggleComplete(todo) {
            const response = await fetch(`/todos/${todo.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: todo.id, title: todo.title, description: todo.description, completed: !todo.completed, due_date: todo.due_date, created_at: todo.created_at, priority: todo.priority || 'green' })
            });
            if (response.ok) {
                fetchTodos();
            }
        }

        async function editTodo(todo) {
            const title = prompt('새 제목을 입력하세요:', todo.title);
            if (title === null) return;
            const description = prompt('새 설명을 입력하세요:', todo.description);
            if (description === null) return;
            const completed = confirm('완료된 작업입니까?');
            const due_date = prompt('마감일 (YYYY-MM-DD, 비우면 삭제):', todo.due_date || '') || null;
            const response = await fetch(`/todos/${todo.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: todo.id, title, description, completed, due_date, created_at: todo.created_at, priority: todo.priority || 'green' })
            });
            if (response.ok) {
                fetchTodos();
            }
        }

        async function deleteTodo(id) {
            const response = await fetch(`/todos/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                fetchTodos();
            }
        }

        document.getElementById('todo-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const due_date = document.getElementById('due_date').value || null;
            const today = new Date().toISOString().slice(0, 10);
            const response = await fetch('/todos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: Date.now(), title, description, completed: false, due_date, created_at: today, priority: 'green' })
            });
            if (response.ok) {
                event.target.reset();
                fetchTodos();
            }
        });

        fetchTodos();
    </script>
</body>
</html>
