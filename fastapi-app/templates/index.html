<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        :root {
            --burgundy: #8B0029;
            --burgundy-dark: #6B001F;
            --burgundy-light: #B8334F;
            --burgundy-soft: #F5E6EA;
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --border: #e5e5e5;
            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        header {
            border-bottom: 3px solid var(--burgundy);
            padding-bottom: 16px;
            margin-bottom: 32px;
        }
        h1 {
            color: var(--burgundy);
            margin: 0;
            font-size: 2em;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 4px;
        }
        h2 {
            font-size: 1.15em;
            color: var(--text);
            margin: 28px 0 12px;
            padding-left: 10px;
            border-left: 4px solid var(--burgundy);
        }
        h2.completed-title {
            border-left-color: var(--text-muted);
            color: var(--text-muted);
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        li:hover { border-color: var(--burgundy-light); }
        li.completed {
            background: #fafafa;
            border-color: var(--border);
        }
        li.completed span.text { text-decoration: line-through; color: var(--text-muted); }
        .text { flex: 1; }
        .text strong { color: var(--burgundy); margin-right: 4px; }
        li.completed .text strong { color: var(--text-muted); }
        .due-date { font-size: 0.85em; color: var(--text-muted); margin-left: 6px; }
        .due-overdue { color: var(--burgundy); font-weight: 600; }

        form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 28px;
            padding: 20px;
            background: var(--burgundy-soft);
            border-radius: 10px;
        }
        input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            font-size: 0.95em;
            flex: 1;
            min-width: 140px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus {
            border-color: var(--burgundy);
            box-shadow: 0 0 0 3px rgba(139, 0, 41, 0.12);
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: background 0.15s, transform 0.05s;
        }
        button:active { transform: translateY(1px); }
        .btn-check {
            background: var(--burgundy);
            color: #fff;
        }
        .btn-check:hover { background: var(--burgundy-dark); }
        .btn-edit {
            background: #fff;
            color: var(--burgundy);
            border: 1px solid var(--burgundy);
        }
        .btn-edit:hover { background: var(--burgundy-soft); }
        .btn-delete {
            background: #fff;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-delete:hover {
            background: var(--burgundy);
            color: #fff;
            border-color: var(--burgundy);
        }
        .btn-submit {
            background: var(--burgundy);
            color: #fff;
            padding: 10px 20px;
        }
        .btn-submit:hover { background: var(--burgundy-dark); }

        .empty {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.9em;
            border: 1px dashed var(--border);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>To-Do List</h1>
        <div class="subtitle">오늘의 할 일을 관리하세요</div>
    </header>

    <h2>미완료 리스트</h2>
    <ul id="todo-incomplete"></ul>

    <h2 class="completed-title">완료 리스트</h2>
    <ul id="todo-complete"></ul>

    <form id="todo-form">
        <input type="text" id="title" placeholder="제목" required>
        <input type="text" id="description" placeholder="설명" required>
        <input type="date" id="due_date">
        <button type="submit" class="btn-submit">추가</button>
    </form>
    <script>
        function sortByDueDate(todos) {
            return todos.slice().sort((a, b) => {
                if (!a.due_date && !b.due_date) return 0;
                if (!a.due_date) return 1;
                if (!b.due_date) return -1;
                return a.due_date.localeCompare(b.due_date);
            });
        }

        function renderTodoItem(todo) {
            const li = document.createElement('li');
            if (todo.completed) li.classList.add('completed');

            const today = new Date().toISOString().slice(0, 10);
            let dueText = '';
            let dueClass = 'due-date';
            if (todo.due_date) {
                dueText = ` | 마감일: ${todo.due_date}`;
                if (!todo.completed && todo.due_date < today) dueClass += ' due-overdue';
            }

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.innerHTML = `<strong>${todo.title}</strong>: ${todo.description}<span class="${dueClass}">${dueText}</span>`;

            const checkButton = document.createElement('button');
            checkButton.className = 'btn-check';
            checkButton.textContent = todo.completed ? '취소' : '완료';
            checkButton.onclick = () => toggleComplete(todo);

            const editButton = document.createElement('button');
            editButton.className = 'btn-edit';
            editButton.textContent = '수정';
            editButton.onclick = () => editTodo(todo.id);

            const deleteButton = document.createElement('button');
            deleteButton.className = 'btn-delete';
            deleteButton.textContent = '삭제';
            deleteButton.onclick = () => deleteTodo(todo.id);

            li.appendChild(textSpan);
            li.appendChild(checkButton);
            li.appendChild(editButton);
            li.appendChild(deleteButton);
            return li;
        }

        function renderEmpty(message) {
            const li = document.createElement('li');
            li.className = 'empty';
            li.style.display = 'block';
            li.style.border = '1px dashed var(--border)';
            li.style.boxShadow = 'none';
            li.textContent = message;
            return li;
        }

        async function fetchTodos() {
            const response = await fetch('/todos');
            const todos = await response.json();

            const incomplete = sortByDueDate(todos.filter(t => !t.completed));
            const complete = sortByDueDate(todos.filter(t => t.completed));

            const incompleteList = document.getElementById('todo-incomplete');
            const completeList = document.getElementById('todo-complete');
            incompleteList.innerHTML = '';
            completeList.innerHTML = '';

            if (incomplete.length === 0) {
                incompleteList.appendChild(renderEmpty('미완료 항목이 없습니다.'));
            } else {
                incomplete.forEach(todo => incompleteList.appendChild(renderTodoItem(todo)));
            }

            if (complete.length === 0) {
                completeList.appendChild(renderEmpty('완료된 항목이 없습니다.'));
            } else {
                complete.forEach(todo => completeList.appendChild(renderTodoItem(todo)));
            }
        }

        async function toggleComplete(todo) {
            const response = await fetch(`/todos/${todo.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: todo.id, title: todo.title, description: todo.description, completed: !todo.completed, due_date: todo.due_date })
            });
            if (response.ok) {
                fetchTodos();
            }
        }

        async function editTodo(id) {
            const title = prompt('새 제목을 입력하세요:');
            const description = prompt('새 설명을 입력하세요:');
            const completed = confirm('완료된 작업입니까?');
            const due_date = prompt('마감일 (YYYY-MM-DD, 비우면 삭제):') || null;
            const response = await fetch(`/todos/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id, title, description, completed, due_date })
            });
            if (response.ok) {
                fetchTodos();
            }
        }

        async function deleteTodo(id) {
            const response = await fetch(`/todos/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                fetchTodos();
            }
        }

        document.getElementById('todo-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const due_date = document.getElementById('due_date').value || null;
            const response = await fetch('/todos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: Date.now(), title, description, completed: false, due_date })
            });
            if (response.ok) {
                event.target.reset();
                fetchTodos();
            }
        });

        fetchTodos();
    </script>
</body>
</html>
